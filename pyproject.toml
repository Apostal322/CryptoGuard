[project]
name = "cryptoguard"
version = "0.1.0"
description = "CryptoGuard — Explainable Wallet Threat Intelligence (read-only Ethereum security analysis)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.35",
    "httpx>=0.27",
    "pycryptodome>=3.20",
]

[project.scripts]
cryptoguard = "cryptoguard.cli:main"

[project.optional-dependencies]
analytics = [
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "scipy-stubs>=1.18.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cryptoguard"]

# Hatchling honours the repository's .gitignore but not a developer's global excludes file,
# so local tool and data files are excluded explicitly (scripts/inspect_dist.py checks).
[tool.hatch.build.targets.sdist]
exclude = [
    "/.claude",
    "/.vscode",
    "/.idea",
    "/data",
    "/.env",
    "*.db",
    "*.sqlite",
    "*.sqlite3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live' --strict-markers"
markers = [
    "live: queries a real Ethereum RPC endpoint (needs CRYPTOGUARD_LIVE_RPC_URL); excluded by default",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["Crypto.*"]
ignore_missing_imports = true
